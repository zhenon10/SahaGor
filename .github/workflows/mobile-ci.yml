name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Kodu getir
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Bagimliliklari yukle
        run: npm ci

      # Expo/React Native projeleri icin gercek bir derleme (native build) CI'da agir ve
      # native SDK/emulator kurulumu gerektirir; bu asamada TypeScript tip kontrolu
      # (kodun kendi icinde tutarli oldugunun dogrulanmasi) yeterli kabul edilir.
      - name: TypeScript tip kontrolu
        run: npm run typecheck
